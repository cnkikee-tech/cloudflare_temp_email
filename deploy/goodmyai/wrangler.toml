name = "goodmyai-mail"
main = "src/worker.ts"
compatibility_date = "2026-11-26"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
routes = [{ pattern = "mail.goodmyai.com", custom_domain = true }]
keep_vars = true

[assets]
directory = "../frontend/dist"
binding = "ASSETS"
run_worker_first = true

[vars]
DEFAULT_LANG = "zh"
TITLE = "GoodMyAI 邮箱"
PREFIX = ""
DEFAULT_DOMAINS = ["goodmyai.com"]
DOMAINS = ["goodmyai.com"]
DISABLE_USER_SYSTEM = true
ENABLE_USER_CREATE_EMAIL = false
ENABLE_USER_DELETE_EMAIL = false
ENABLE_AUTO_REPLY = false

[[d1_databases]]
binding = "DB"
database_name = "goodmyai-mail"
database_id = "cc16f11a-9fbb-4cb1-af4d-fd592b33290d"
